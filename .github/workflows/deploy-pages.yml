name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a newer push cancels a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build static export
        run: node scripts/build-github-pages.mjs
        # Inlined rather than read from repo variables. All three are
        # publishable-by-design: they are baked into the client bundle at build
        # time and are already readable by anyone who loads the deployed site,
        # so keeping them here adds no exposure and removes a hand-entry step
        # that silently broke two deploys. Anything genuinely secret (e.g. the
        # service role key) must stay out of this file — see .env.example.
        env:
          VITE_SUPABASE_URL: https://pbjpypcdiwvxegewxleu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YAPkzwW2eH09Cjhuqw_ziA_UxWTYxdC
          VITE_SUPABASE_PROJECT_ID: pbjpypcdiwvxegewxleu

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
