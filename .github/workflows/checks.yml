# Typecheck, lint and tests on every push and pull request.
#
# Lint is here because it now passes. It reported about 1,800 problems until the
# formatter was run across the repository — a check that is red on arrival
# teaches everyone to ignore it, which is worse than no check, so it was left
# out until the number was zero.
#
# Not `bun run build`: Vercel builds every push already, and duplicating it here
# would double the wait to learn the same thing.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI fails on a lockfile that does not match
      # package.json, rather than quietly resolving something different from
      # what anyone has run locally.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
